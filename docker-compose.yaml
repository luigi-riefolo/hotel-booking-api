services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel
      POSTGRES_DB: hotel
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hotel"]
      interval: 2s
      retries: 10

  api:
    build: .
    environment:
      POSTGRES_HOST: db
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
